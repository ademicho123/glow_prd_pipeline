name: AI-Native Pipeline | PRD → Code → Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'specs/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prd_file:
        description: 'PRD/Spec file to process'
        required: false
        default: 'specs/claims-auto-approval.json'

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: glow-claims-api
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # PHASE 1: SPECIFICATION GENERATION (PRD → Structured Spec)
  # ============================================================
  spec-generation:
    name: 📋 PRD → Specification
    runs-on: ubuntu-latest
    outputs:
      spec_hash: ${{ steps.spec.outputs.hash }}
      has_changes: ${{ steps.spec.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Dependencies
        run: pip install -r requirements.txt

      - name: Generate Structured Specification
        id: spec
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/prd_to_spec.py \
            --input "${{ github.event.inputs.prd_file || 'specs/claims-auto-approval.json' }}" \
            --output specs/generated/

          # Hash for cache invalidation
          SPEC_HASH=$(sha256sum specs/generated/specification.json | cut -d' ' -f1)
          echo "hash=$SPEC_HASH" >> $GITHUB_OUTPUT

          # Check if spec changed
          git diff --quiet specs/generated/ && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Validate Specification Schema
        run: |
          python scripts/validate_spec.py specs/generated/specification.json

      - name: Upload Specification Artifact
        uses: actions/upload-artifact@v4
        with:
          name: specification
          path: specs/generated/
          retention-days: 30

  # ============================================================
  # PHASE 2: AI CODE GENERATION (Python Flask API)
  # ============================================================
  code-generation:
    name: ⚡ Specification → Code
    runs-on: ubuntu-latest
    needs: spec-generation
    if: needs.spec-generation.outputs.has_changes == 'true'
    outputs:
      code_generated: ${{ steps.codegen.outputs.success }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Specification
        uses: actions/download-artifact@v4
        with:
          name: specification
          path: specs/generated/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Code Generation Dependencies
        run: pip install -r requirements.txt

      - name: Generate Python Flask API Code
        id: codegen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p src/generated
          python scripts/spec_to_code.py \
            --spec specs/generated/specification.json \
            --output src/generated/

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Generate Unit Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p tests/generated
          python scripts/generate_tests.py \
            --spec specs/generated/specification.json \
            --code src/generated/ \
            --output tests/generated/

      - name: Upload Generated Code
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: |
            src/generated/
            tests/generated/

  # ============================================================
  # PHASE 3: AI CODE REVIEW
  # ============================================================
  ai-code-review:
    name: 🤖 AI Code Review
    runs-on: ubuntu-latest
    needs: code-generation
    steps:
      - uses: actions/checkout@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
          path: ./

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: AI Security & Quality Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/ai_code_review.py \
            --code src/generated/ \
            --checklist "security,performance,compliance,best-practices" \
            --output review-report.json

      - name: Check Review Results
        run: |
          CRITICAL=$(jq '.critical_issues | length' review-report.json)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical issues found in AI review"
            jq '.critical_issues' review-report.json
            exit 1
          fi
          echo "✅ AI review passed"

      - name: Post Review to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('review-report.json', 'utf8'));

            let body = '## 🤖 AI Code Review Results\n\n';
            body += `**Security Score:** ${review.security_score}/100\n`;
            body += `**Quality Score:** ${review.quality_score}/100\n\n`;

            if (review.suggestions.length > 0) {
              body += '### Suggestions\n';
              review.suggestions.forEach(s => body += `- ${s}\n`);
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================
  # PHASE 4: QUALITY GATES (Python Validation)
  # ============================================================
  quality-gates:
    name: 🛡️ Quality Gates
    runs-on: ubuntu-latest
    needs: [code-generation, ai-code-review]
    steps:
      - uses: actions/checkout@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
          path: ./

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flask pydantic pytest

      - name: Syntax Check Generated Code
        run: |
          echo "✅ Checking Python syntax..."
          python -m py_compile src/generated/*.py
          echo "✅ Generated code is syntactically valid!"

      - name: Show Generated Files
        run: |
          echo "📁 Generated files:"
          ls -lh src/generated/
          echo ""
          echo "📄 API Code Preview:"
          head -50 src/generated/api.py || echo "No api.py found"
          echo ""
          echo "📄 Models Preview:"
          head -30 src/generated/models.py || echo "No models.py found"

      # Optional: Run tests if you want
      # - name: Run Unit Tests
      #   run: |
      #     cd tests/generated
      #     pytest test_api.py -v

  # ============================================================
  # PHASE 5: PROMPT REGRESSION TESTING (Optional - Non-blocking)
  # ============================================================
  prompt-regression:
    name: 🧪 Prompt Regression Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    continue-on-error: true  # Non-blocking - allow to fail
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Golden Test Cases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/prompt_regression.py \
            --golden-tests tests/golden/ \
            --threshold 0.95 \
            --output prompt-regression-report.json

      - name: Check for Logic Drift
        run: |
          DRIFT=$(jq '.drift_detected' prompt-regression-report.json)
          if [ "$DRIFT" = "true" ]; then
            echo "⚠️ Logic drift detected in prompt outputs"
            jq '.drift_details' prompt-regression-report.json
            exit 1
          fi

  # ============================================================
  # PHASE 6: BUILD & PUSH CONTAINER
  # ============================================================
  build-container:
    name: 📦 Build Container
    runs-on: ubuntu-latest
    needs: quality-gates
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
          path: ./

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # PHASE 7: DEPLOY TO STAGING (DISABLED FOR DEMO)
  # ============================================================
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: build-container
    if: false  # Disabled for demo
    environment:
      name: staging
      url: https://staging.glow-claims.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: glow-rg-staging
          containerAppName: glow-claims-staging
          imageToDeploy: ${{ needs.build-container.outputs.image_tag }}

      - name: Run Smoke Tests
        run: |
          sleep 30  # Wait for deployment

          # Health check
          curl -f https://staging.glow-claims.azurewebsites.net/health || exit 1

          # API smoke test
          RESPONSE=$(curl -s -X POST \
            https://staging.glow-claims.azurewebsites.net/api/v1/claims/screen-damage/approve \
            -H "Content-Type: application/json" \
            -d '{"claim_amount_gbp": 150, "damage_type": "SCREEN", "risk_score": 0.2}')

          STATUS=$(echo $RESPONSE | jq -r '.status')
          if [ "$STATUS" != "APPROVED" ]; then
            echo "❌ Smoke test failed: Expected APPROVED, got $STATUS"
            exit 1
          fi
          echo "✅ Staging smoke tests passed"

  # ============================================================
  # PHASE 8: DEPLOY TO PRODUCTION (DISABLED FOR DEMO)
  # ============================================================
  deploy-production:
    name: 🎯 Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: false  # Disabled for demo
    environment:
      name: production
      url: https://api.glow-claims.com
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Production
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: glow-rg-prod
          containerAppName: glow-claims-prod
          imageToDeploy: ${{ needs.build-container.outputs.image_tag }}

      - name: Verify Production Health
        run: |
          sleep 30
          curl -f https://api.glow-claims.com/health || exit 1
          echo "✅ Production deployment verified"

      - name: Update Deployment Telemetry
        run: |
          curl -X POST ${{ secrets.TELEMETRY_ENDPOINT }} \
            -H "Authorization: Bearer ${{ secrets.TELEMETRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "event": "deployment",
              "environment": "production",
              "version": "${{ github.sha }}",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }'

  # ============================================================
  # PHASE 9: POST-DEPLOYMENT MONITORING (DISABLED FOR DEMO)
  # ============================================================
  monitor:
    name: 📊 Post-Deploy Monitor
    runs-on: ubuntu-latest
    needs: deploy-production
    if: false  # Disabled for demo
    steps:
      - name: Configure Alerts
        run: |
          echo "Setting up deployment monitoring..."
          # Azure Monitor / Datadog / custom alerting

      - name: Baseline Comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Compare current metrics against baseline
          python scripts/baseline_check.py \
            --metric approval_rate \
            --threshold 0.1 \
            --alert-on-drift
